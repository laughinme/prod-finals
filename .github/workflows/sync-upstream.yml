name: Sync upstream

# Keeps this copy in step with luhgeek1/T-match: merges new upstream commits and starts the deploy workflow.
# (A push made with GITHUB_TOKEN does not trigger other workflows, so the deploy is dispatched explicitly.)
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "home-server sync"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream https://github.com/luhgeek1/T-match.git
          git fetch -q upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then echo "already up to date"; exit 0; fi
          git merge --no-edit upstream/master
          git push origin HEAD:master
          gh workflow run deploy-home.yml --ref master
